<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOCC: Forge of Azaroth</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    
    <style>
        /* --- 1. HAREKETLİ SU ALTI ARKA PLANI (SABİT) --- */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #050b14;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .su-alti-animasyon {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(180deg, #0a192f 0%, #050c18 50%, #02060d 100%);
            background-size: 200% 200%;
            animation: okyanusAkisi 12s ease infinite;
        }

        .su-alti-animasyon::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background-image: radial-gradient(rgba(0, 212, 255, 0.1) 1px, transparent 0);
            background-size: 40px 40px;
            animation: baloncukYukselis 8s linear infinite;
        }

        @keyframes okyanusAkisi {
            0% { background-position: 50% 0%; }
            50% { background-position: 50% 100%; }
            100% { background-position: 50% 0%; }
        }

        @keyframes baloncukYukselis {
            0% { transform: translateY(100vh); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-100vh); opacity: 0; }
        }

        /* --- 2. PANEL VE İÇERİK TASARIMI --- */
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            color: #00d4ff;
            font-size: 26px;
            margin-top: 10px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(0, 212, 255, 0.6);
        }

        .subtitle {
            color: #8892b0;
            font-size: 13px;
            margin-bottom: 25px;
            padding: 0 10px;
        }

        .hero-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .hero-card {
            background: rgba(10, 25, 47, 0.7);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            text-align: left;
            position: relative;
            backdrop-filter: blur(5px);
        }

        /* --- 3. HAREKETLİ NFT RESİM ALANLARI (EFEKTLER) --- */
        .hero-img-container {
            position: relative;
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-img {
            width: 100%;
            height: 100%;
            border-radius: 10px;
            background: #172a45;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            z-index: 2;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            animation: cüceNefes 3s ease-in-out infinite alternate;
        }

        /* Arkadaki Hareketli Enerji Halesi (Aura) */
        .nft-aura {
            position: absolute;
            width: 85%;
            height: 85%;
            border-radius: 50%;
            z-index: 1;
            filter: blur(8px);
            animation: auraDonus 4s linear infinite;
        }

        @keyframes cüceNefes {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        @keyframes auraDonus {
            0% { transform: rotate(0deg); opacity: 0.6; }
            50% { opacity: 0.9; }
            100% { transform: rotate(360deg); opacity: 0.6; }
        }

        .hero-info {
            flex: 1;
        }

        .hero-name {
            font-size: 17px;
            font-weight: bold;
            margin: 0 0 4px 0;
        }

        .rarity-badge {
            font-size: 10px;
            text-transform: uppercase;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
        }

        /* Nadirlik Renkleri ve Özel Animasyonlar */
        .common { border: 1px solid #a0a0a0; }
        .common .rarity-badge { background: #5a5a5a; color: #e0e0e0; }
        .common .hero-name { color: #e0e0e0; }
        .common .nft-aura { background: conic-gradient(#5a5a5a, #ffffff, #5a5a5a); }

        .uncommon { border: 1px solid #00ffcc; }
        .uncommon .rarity-badge { background: #006652; color: #00ffcc; }
        .uncommon .hero-name { color: #00ffcc; }
        .uncommon .nft-aura { background: conic-gradient(#00ffcc, transparent, #00ffcc); }

        .rare { border: 1px solid #ff5500; }
        .rare .rarity-badge { background: #882200; color: #ffaa66; }
        .rare .hero-name { color: #ffaa66; }
        .rare .nft-aura { background: conic-gradient(#ff5500, #ffaa66, #ff5500); animation-duration: 2.5s; }

        .epic { border: 1px solid #b026ff; }
        .epic .rarity-badge { background: #550088; color: #dfa6ff; }
        .epic .hero-name { color: #dfa6ff; }
        .epic .nft-aura { background: conic-gradient(#b026ff, #00d4ff, #b026ff); animation-duration: 2s; }

        /* Efsanevi Azaroth - Süper Hareketli Altın Işıltı */
        .legendary { 
            border: 1px solid #ffcc00; 
            animation: efsaneviParlama 2s ease-in-out infinite alternate;
        }
        .legendary .rarity-badge { background: #886600; color: #ffee55; }
        .legendary .hero-name { color: #ffee55; text-shadow: 0 0 10px rgba(255,204,0,0.6); }
        .legendary .nft-aura { 
            background: conic-gradient(#ffcc00, #ffffff, #ffaa00, #ffcc00); 
            animation-duration: 1.5s;
            filter: blur(12px);
        }

        @keyframes efsaneviParlama {
            0% { box-shadow: 0 0 8px rgba(255,204,0,0.3); }
            100% { box-shadow: 0 0 22px rgba(255,204,0,0.7); border-color: #ffffff; }
        }

        /* --- 4. TON CONNECT BUTON ALANI --- */
        #ton-connect-container {
            display: flex;
            justify-content: center;
            margin-top: 25px;
            width: 100%;
        }
        
        /* Kütüphanenin kendi butonunu geniş ve şık yapmak için */
        .go2543141717 {
            width: 100% !important;
            justify-content: center !important;
        }
    </style>
</head>
<body>

    <div class="su-alti-animasyon"></div>

    <div class="container">
        
        <h1>LOCC: Forge of Azaroth</h1>
        <div class="subtitle">Su Altı Demirhanesine Hoş Geldiniz. Kadim Kahramanları Toplayın.</div>

        <div class="hero-list">
            
            <div class="hero-card common">
                <div class="hero-img-container">
                    <div class="nft-aura"></div>
                    <div class="hero-img">✊</div>
                </div>
                <div class="hero-info">
                    <p class="hero-name">Valkor Demiryumruk</p>
                    <span class="rarity-badge">Sıradan</span>
                </div>
            </div>

            <div class="hero-card uncommon">
                <div class="hero-img-container">
                    <div class="nft-aura"></div>
                    <div class="hero-img">🪓</div>
                </div>
                <div class="hero-info">
                    <p class="hero-name">Beryn Buzçekici</p>
                    <span class="rarity-badge">Az Bulunur</span>
                </div>
            </div>

            <div class="hero-card rare">
                <div class="hero-img-container">
                    <div class="nft-aura"></div>
                    <div class="hero-img">🔥</div>
                </div>
                <div class="hero-info">
                    <p class="hero-name">Grendel Magmaözü</p>
                    <span class="rarity-badge">Nadir</span>
                </div>
            </div>

            <div class="hero-card epic">
                <div class="hero-img-container">
                    <div class="nft-aura"></div>
                    <div class="hero-img">⚡</div>
                </div>
                <div class="hero-info">
                    <p class="hero-name">Thrain Gökgürültüsü</p>
                    <span class="rarity-badge">Epik</span>
                </div>
            </div>

            <div class="hero-card legendary">
                <div class="hero-img-container">
                    <div class="nft-aura"></div>
                    <div class="hero-img">👑</div>
                </div>
                <div class="hero-info">
                    <p class="hero-name">Azaroth: Okyanusun Kalbi</p>
                    <span class="rarity-badge">Efsanevi</span>
                </div>
            </div>

        </div>

        <div id="ton-connect-container"></div>

    </div>

    <script>
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://locc-awaking.vercel.app/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-container'
        });
    </script>

</body>
</html>
