<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Forge of Azeroth - Mini App</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
</head>
<body>

    <div class="video-background">
        <video autoplay muted loop playsinline id="bg-video">
            <source src="71686.mp4" type="video/mp4">
        </video>
        <div class="video-overlay"></div>
    </div>

    <div class="game-container">
        
        <header class="header-bar">
            <div class="stat-badge energy">
                <span class="icon">🔋</span>
                <span id="energy-text">100/100</span>
            </div>
            
            <div id="ton-connect"></div>

            <div class="stat-badge diamond">
                <span class="icon">💎</span>
                <span id="diamond-text">0.00</span>
            </div>
        </header>

        <h1 class="game-title">FORGE OF AZEROTH</h1>

        <main class="forge-area">
            <div class="orbit-container">
                <button class="center-forge-btn" id="forge-click-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#ff9900" class="hammer-icon">
                        <path d="M21.58 12.38l-1.96-1.96c-.39-.39-1.02-.39-1.41 0l-1.57 1.57-2.67-2.67 1.57-1.57c.39-.39.39-1.02 0-1.41L13.58 4.38c-.39-.39-1.02-.39-1.41 0l-1.96 1.96c-.39.39-.39 1.02 0 1.41l1.57 1.57-7.85 7.85c-.39.39-.39 1.02 0 1.41l1.96 1.96c.39.39 1.02.39 1.41 0l7.85-7.85 1.57 1.57c.39.39 1.02.39 1.41 0l1.96-1.96c.4-.39.4-1.03 0-1.42z"/>
                    </svg>
                </button>

                <div class="node node-v">V <span class="multiplier">x3</span></div>
                <div class="node node-b">B <span class="multiplier">x2</span></div>
                <div class="node node-g">G <span class="multiplier">x2</span></div>
                <div class="node node-t">T <span class="multiplier">x4</span></div>
                <div class="node node-a">A <span class="multiplier">x7</span></div>
            </div>
        </main>

        <section class="mining-stats-box">
            <p class="stats-label">BİRİKEN KADİM DEMİR</p>
            <h2 class="stats-counter" id="iron-counter">41.05</h2>
            <p class="stats-speed">⚡ +333.00 / saat</p>
        </section>

        <footer class="bottom-nav">
            <button class="nav-item active">
                <span class="nav-icon">⚒️</span>
                <span class="nav-text">Üretim</span>
            </button>
            <button class="nav-item">
                <span class="nav-icon">📜</span>
                <span class="nav-text">Görevler</span>
            </button>
            <button class="nav-item">
                <span class="nav-icon">🏪</span>
                <span class="nav-text">Mağaza</span>
            </button>
            <button class="nav-item">
                <span class="nav-icon">👥</span>
                <span class="nav-text">Referans</span>
            </button>
            <button class="nav-item">
                <span class="nav-icon">👤</span>
                <span class="nav-text">Profil</span>
            </button>
        </footer>

    </div>

    <script src="script.js"></script>
    
    <script>
        // Hata vermemesi için TON_CONNECT_UI kontrol edilerek cüzdan başlatılıyor
        if (typeof TON_CONNECT_UI !== 'undefined') {
            const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
                manifestUrl: window.location.origin + '/tonconnect-manifest.json',
                buttonRootId: 'ton-connect'
            });
        }
    </script>
</body>
</html>
